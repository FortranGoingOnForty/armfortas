[workspace]
members = [".", "afs-as", "afs-ld", "runtime", "bencch/bench-core", "bencch/bench"]
resolver = "2"

[profile.dev]
# Keep the default debug-friendly profile, but avoid the pathological
# opt-level=0 slowdown when using armfortas itself as the compiler.
opt-level = 1

[package]
name = "armfortas"
version = "0.1.0"
edition = "2021"
description = "Bespoke ARM64 Fortran compiler"

[lib]
name = "armfortas"
path = "src/lib.rs"

[[bin]]
name = "armfortas"
path = "src/main.rs"

# `afs` is the short alias.  src/bin/afs.rs is a one-line wrapper
# that calls into armfortas::cli_entry() so cargo doesn't warn about
# two bin targets sharing one source path.  Sprint 35's `make
# install` may collapse this back to a symlink to save disk.
[[bin]]
name = "afs"
path = "src/bin/afs.rs"

[dependencies]
afs-as = { path = "afs-as" }
