name: CI

on:
  push:
    branches: [trunk]
  # No base-branch filter: the sprint workflow stacks PRs on other
  # sprint branches (x01 on x00, ...), and a `branches: [trunk]` filter
  # here matches the BASE, silently skipping CI on every stacked PR.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: .cargo-target

jobs:
  # Detect whether a change can affect either path-gated standalone suite.
  # afs-as is independent of the armfortas compiler crate. The afs-ld matrix,
  # however, builds and consumes both afs-as and armfortas-rt, so its filter
  # must include those transitive inputs as well as the linker itself.
  # Skipped required jobs count as passing for branch protection.
  changes:
    name: "Detect changed paths"
    runs-on: ubuntu-latest
    outputs:
      afs_as: ${{ steps.filter.outputs.afs_as }}
      afs_ld: ${{ steps.filter.outputs.afs_ld }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            afs_as:
              - 'afs-as'
              - 'afs-as/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            afs_ld:
              - 'afs-ld'
              - 'afs-ld/**'
              - 'afs-as'
              - 'afs-as/**'
              - 'runtime/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  build:
    name: Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace

  clippy:
    name: Clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --exclude bencch-core --exclude afs-tests -- -D warnings -A clippy::too_many_arguments

  format:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test-workspace-libs:
    name: "Tests: workspace library units"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --lib --release

  test-end-to-end:
    name: "Tests: end-to-end (compile + run Fortran programs)"
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --release
      - run: cargo test --release --test run_programs -- --nocapture
      # x10: per-target benchmark gate. Size-only in CI (time baselines
      # come from the fleet machines and don't compare across hosts).
      - run: BENCH_SKIP_TIME=1 ./scripts/benchmark_gate.sh

  # All integration suites in tests/*.rs: audit reproducers, multi-file
  # compilation, cross-TU ABI matrix, module host association, optimizer
  # audits, IPO/IPA, pure-call reuse, LICM, SROA, mem2reg, vectorizer,
  # incremental compilation, determinism, etc. Leaving these out of CI
  # is how audits found miscompiles we should have caught on PR.
  # --tests builds every target under tests/ including run_programs —
  # paying the cost of compiling the compiler once is cheaper than
  # fragmenting into 20+ per-target jobs, and keeping them together
  # makes regressions in *any* suite block the merge.
  test-integration:
    name: "Tests: integration suites"
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --release
      # Pre-build test binaries so the timed test step measures only
      # execution, not compilation. This branch ships ~91 integration
      # test files; building all of them inside `cargo test` previously
      # consumed the bulk of the timed step on macos-latest.
      - run: cargo test -p armfortas --tests --release --no-run
      # Serialize libtest output so each machine-readable skip record remains
      # intact for the exact manifest comparison below.
      - run: ci/run_logged.sh /tmp/tests.log cargo test -p armfortas --tests --release -- --nocapture --test-threads=1
      - run: ci/check_skips.sh /tmp/tests.log macos

  test-afs-as:
    name: "Tests: afs-as full suite (${{ matrix.os }})"
    needs: changes
    if: needs.changes.outputs.afs_as == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Explicit Apple Silicon label: macos-latest is a migrating alias.
          - os: macos-15
            host_os: Darwin
            host_arch: arm64
            skip_profile: macos-arm64
          - os: ubuntu-latest
            host_os: Linux
            host_arch: x86_64
            skip_profile: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: ci/assert_host.sh "${{ matrix.host_os }}" "${{ matrix.host_arch }}"
      - run: ci/run_logged.sh /tmp/afs-as-tests.log cargo test -p afs-as --all-targets -- --nocapture
      - run: ci/check_afs_as_skips.sh /tmp/afs-as-tests.log "${{ matrix.skip_profile }}"

  test-afs-ld:
    name: "Tests: afs-ld full suite (${{ matrix.os }})"
    needs: changes
    if: needs.changes.outputs.afs_ld == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            skip_profile: macos
          - os: ubuntu-latest
            skip_profile: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p armfortas-rt -p afs-as
      - run: ci/run_logged.sh /tmp/afs-ld-tests.log cargo test -p afs-ld --all-targets -- --nocapture --test-threads=1
      - run: afs-ld/ci/check_skips.sh /tmp/afs-ld-tests.log "${{ matrix.skip_profile }}"

  # ---- Sprint x01: non-macOS hosts. Compiler + lib suite run for real;
  # e2e suites skip with machine-readable counts until x06 lands the
  # native ELF toolchain path. The complete afs-as suite has its own
  # path-gated macOS/Linux matrix above.
  build-linux-gnu:
    name: "Linux glibc: build + tests (e2e skip-gated)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace
      - run: cargo test -p armfortas --lib
      - shell: bash
        run: |
          set -o pipefail
          cargo test -p armfortas --tests -- --nocapture --test-threads=1 2>&1 | tee /tmp/tests.log
      - run: ci/check_skips.sh /tmp/tests.log posix-elf
      # x09: SSE-only FP — fail on any x87 mnemonic at -O2/-Ofast.
      - run: ci/check_x87.sh
      # x10: SSE2 ceiling — fail on any SSE3+/SSE4/AVX mnemonic at
      # -O3/-Ofast (the vectorizer's baseline contract).
      - run: ci/check_isa_ceiling.sh
      # x10: per-target benchmark gate (size-only in CI; see script).
      - run: cargo build --release -p armfortas -p armfortas-rt
      - run: BENCH_SKIP_TIME=1 ./scripts/benchmark_gate.sh
      # x09: surface the full opt-matrix counts in the job summary.
      - run: grep -E '\[-O[A-Za-z0-9]+\] .* passed' /tmp/tests.log >> "$GITHUB_STEP_SUMMARY" || true

  build-linux-musl:
    name: "Linux musl: build + tests (e2e skip-gated)"
    runs-on: ubuntu-latest
    container: rust:1-alpine
    steps:
      # rust:1-alpine has no git; without it actions/checkout falls back
      # to a REST tarball download that cannot fetch submodules. Install
      # deps BEFORE checkout (binutils: rustc needs a linker for test
      # binaries; the image ships none).
      - run: apk add --no-cache git binutils musl-dev grep bash
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cargo build --workspace
      - run: cargo test -p armfortas --lib
      - shell: bash
        run: |
          set -o pipefail
          cargo test -p armfortas --tests -- --nocapture --test-threads=1 2>&1 | tee /tmp/tests.log
      - run: ci/check_skips.sh /tmp/tests.log posix-elf-musl

  build-freebsd:
    name: "FreeBSD 15: build + lib tests (VM)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # VM boots fresh each run: no cargo cache, minutes of overhead.
      # Keep the surface small; e2e sweeps on FreeBSD wait for x06/x07.
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          # binutils explicitly: FreeBSD base has no `as` (LLVM base
          # tools), and the rust package's dependency set has drifted
          # on whether it pulls one in. The driver shells out to `as`
          # for ELF assembly (until afs-as x86 lands in x14).
          prepare: pkg install -y rust binutils bash
          run: |
            export CARGO_TARGET_DIR="$PWD/.cargo-target"
            cargo build --workspace
            cargo test -p armfortas --lib
            cargo test -p armfortas-rt system::tests::cpu_time_matches_freebsd_clock_scale -- --exact
            # --exact: the bare substring also matches the _o1.._ofast
            # matrix fns, which x09's gate opening turned into six real
            # concurrent sweeps — more than this small VM can run
            # (assembler spawns started failing). The full matrix
            # belongs to the ubuntu/macOS jobs; this VM smoke-tests
            # FreeBSD at -O0.
            ci/run_logged.sh /tmp/sweep.log \
              cargo test --test run_programs test_programs_end_to_end -- --exact --nocapture
            grep -E '\[-O0\] .* passed' /tmp/sweep.log
            # x10: per-target benchmark gate (size-only in CI).
            cargo build --release -p armfortas -p armfortas-rt
            BENCH_SKIP_TIME=1 ./scripts/benchmark_gate.sh
