      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p afs-as --test diagnostic_snapshots

  test-afs-as-clang-dashboard:
    name: "Tests: afs-as clang probe dashboard"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p afs-as --test clang_probe_dashboard

  test-afs-as-generated-stress:
    name: "Tests: afs-as generated stress"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p afs-as --test generated_stress

  test-afs-as-differential-fuzz:
    name: "Tests: afs-as differential fuzz"
