[workspace]
members = [".", "afs-as", "runtime", "bencch/bench-core", "bencch/bench"]
resolver = "2"

[package]
name = "armfortas"
version = "0.1.0"
edition = "2021"
description = "Bespoke ARM64 Fortran compiler"

[lib]
name = "armfortas"
path = "src/lib.rs"

[[bin]]
name = "armfortas"
path = "src/main.rs"

[dependencies]
afs-as = { path = "afs-as" }
